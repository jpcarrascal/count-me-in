<!DOCTYPE html>
<html>
  <head>
    <title>COUNT·ME·IN</title>
    <link rel="stylesheet" href="css/sequencer.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0">
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5JXMQXE0QJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-5JXMQXE0QJ');
    </script>
  </head>
  <body>

    <div id="session-info">
      <div id="close-info">✕</div>
      <div class="session-info instruction"><span class="step-num start-session-step">3</span><span>Share this QR code or link with the audience</span></div>

      <div class="session-info" id="qrcode-wrapper"></div>

      <div class="session-info">
        <a id="track-url" target="_blank"></a>
      </div>
      
      <div class="session-info">
        <div id="copy">COPY LINK TO CLIPBOARD</div>
      </div>

      <div class="session-info instruction start-session-step"><span class="step-num">4</span><span>When everyone's in, start the session:</span></div>

      <div class="session-info start-session-step">
        <input type="button" class="ui-button" id="start-session" value="START SESSION" />
      </div>

      <textarea id="url-copy"></textarea>
    </div>

    <!-- <div id="backdrop" class="zero-top slide-top"> -->
    <div id="backdrop" class="zero-top slide-top">
      <img id="logo-image" src="images/spacebarman-logo.png" />
      <span id="click-me-first">Click to start!</span>
    </div>

    <div id="sequencer">

        <table id="matrix">
        </table>

        <div id="control-panel">

          <button id="play" class="controls">&#9654;</button>
          <button id="stop" class="controls">&#9724;</button>

          <span class="controls" id="ext-clock-indicator">[<span id="ext-clock">External clock</span>]</span>
          <span id="ext-tempo" class="controls"></span>

          <div id="bpm">
            <input id="tempo" type="number" class="controls" value=98 min="60" max="250"/>
            <span class="controls">BPM</span>
          </div>
          

          <button class="controls" id="show-session-link">
            Session info
          </button>

          <button class="controls" id="clear-all">
            Clear all
          </button>

          <span class="controls play-audio">Audio:</span><input type="checkbox" id="play-audio" class="controls play-audio" checked/>

        </div>

    </div>

    <div id="sequencer-bg">
      <p>
      COUNT-ME-IN<br />
      </p>
    </div>

    <div id="sound-set">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="scripts/config.js"></script>
    <script src="scripts/include.js"></script>
    <script src="scripts/sessionObj.js"></script>
    <script src="scripts/sequencer.js"></script>
    <script src="scripts/noteOperations.js"></script>
    <script src="scripts/audio.js"></script>
    <script src="scripts/midi.js"></script>


  </body>
</html>
